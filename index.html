<!doctype html>
<html lang="ko" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" href="/src/assets/glyf-logo.webp" />
    <link rel="preload" as="image" href="/src/assets/gloss-cutouts.webp" />
    <link rel="preload" as="image" href="/src/assets/badge-candies.webp" />
    <link rel="preload" as="image" href="/src/assets/badge-ready.webp" />
    <link rel="preload" as="image" href="/src/assets/plush-cutouts.png" />
    <title>GLYF — Your weird little world</title>
    <meta name="description" content="GLYF의 핑크 글리터 월드. 젤리를 모으고, 나만의 GLYF 포토카드를 만들어 보세요." />
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <defs>
        <filter id="speech-outline" x="-100%" y="-200%" width="300%" height="500%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="outline" />
          <feFlood flood-color="#000" result="black" />
          <feComposite in="black" in2="outline" operator="in" result="border" />
          <feMerge>
            <feMergeNode in="border" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="product-hover-outline" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="expanded" />
          <feComposite in="expanded" in2="SourceAlpha" operator="out" result="ring" />
          <feFlood flood-color="#ffff00" flood-opacity="0.95" result="yellow" />
          <feComposite in="yellow" in2="ring" operator="in" />
        </filter>
      </defs>
    </svg>
    <div id="app"></div>
    <div class="startup-loading" role="status"><img src="/src/assets/loading.png" alt="LOADING..."></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
